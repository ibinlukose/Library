<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container my-5 mt-5 ">
        <h1 class="text-center text-primary">LIBRARY</h1>
       <form id="userform">
        <div class="row my-5 ">
            <div class="col-lg-3">
                <input id="bookid" type="text" placeholder="Book no" class="form-control">
            </div>
            <div class="col-lg-3">
                <input id="bookname" type="text" placeholder="Book name" class="form-control">
            </div>
            <div class="col-lg-3">
                <input id="authorname" type="text" placeholder="Author name" class="form-control">
            </div>
            <div class="col-lg-3" >
                <button class="btn btn-success w-100 " >save</button>

            </div>

        </div>
        <input type="hidden" id="editstatus">
        <input id="searchBook" type="text" placeholder="Search book name" class="form-control">

       </form>
       <table class="table table-hover table-bordered my-5">
        <thead class="text-align text-center table-dark my-5 " >
            <tr>
                <th>Book no</th>
                <th> Book Name</th>
                <th>Author Name </th>
                <th>Action</th>

            </tr>
        </thead>
        <tbody id="tablebody" class="text-center">
           

        </tbody>

       </table>


    </div>
    
</body>
<script src="main.js"></script>
</html>
